name: Android CI • Release APKs

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marblemd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
          test -d "$ANDROID_SDK_ROOT/build-tools/37.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Compute commit version
        shell: bash
        run: |
          set -euo pipefail
          version_code="${GITHUB_RUN_NUMBER}"
          version_name="1.0.${version_code}"
          tag="v${version_name}"
          short_sha="${GITHUB_SHA:0:8}"
          echo "MARBLEMD_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "MARBLEMD_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "MARBLEMD_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "MARBLEMD_SHORT_SHA=$short_sha" >> "$GITHUB_ENV"
          echo "Version: $version_name ($version_code), commit $short_sha"

      - name: Prepare stable release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MARBLEMD_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.MARBLEMD_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MARBLEMD_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MARBLEMD_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/marblemd-release.p12"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            keytool -genkeypair -noprompt \
              -keystore "$keystore" \
              -storetype PKCS12 \
              -storepass marblemd-ci \
              -keypass marblemd-ci \
              -alias marblemd-ci \
              -keyalg RSA -keysize 3072 -validity 3650 \
              -dname "CN=MarbleMD CI,O=MarbleMD,C=US"
            store_password="marblemd-ci"
            key_alias="marblemd-ci"
            key_password="marblemd-ci"
          else
            [[ -n "$KEYSTORE_B64" ]] || { echo "::error::Missing MARBLEMD_RELEASE_KEYSTORE_B64"; exit 1; }
            [[ -n "$STORE_PASSWORD" ]] || { echo "::error::Missing MARBLEMD_RELEASE_STORE_PASSWORD"; exit 1; }
            [[ -n "$KEY_ALIAS" ]] || { echo "::error::Missing MARBLEMD_RELEASE_KEY_ALIAS"; exit 1; }
            [[ -n "$KEY_PASSWORD" ]] || { echo "::error::Missing MARBLEMD_RELEASE_KEY_PASSWORD"; exit 1; }

            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
            store_password="$STORE_PASSWORD"
            key_alias="$KEY_ALIAS"
            key_password="$KEY_PASSWORD"
          fi

          keytool -list -keystore "$keystore" -storepass "$store_password" -alias "$key_alias" >/dev/null
          echo "MARBLEMD_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          echo "MARBLEMD_STORE_PASSWORD=$store_password" >> "$GITHUB_ENV"
          echo "MARBLEMD_KEY_ALIAS=$key_alias" >> "$GITHUB_ENV"
          echo "MARBLEMD_KEY_PASSWORD=$key_password" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Android Lint
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace lintDebug
          rc=$?
          set -e
          if (( rc != 0 )); then
            echo
            echo "========== FULL ANDROID LINT REPORT =========="
            report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            if [[ -f "$report" ]]; then
              cat "$report"
            else
              find app/build -type f -name "lint-results-*.txt" -print -exec cat {} \; || true
            fi
            echo "==============================================="
          fi
          exit "$rc"

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MarbleMD-Lint-${{ github.sha }}
          path: |
            app/build/reports/lint-results-debug.*
            app/build/intermediates/lint_intermediate_text_report/**/lint-results-*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Build signed release APKs
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare standalone Release assets
        shell: bash
        run: |
          set -euo pipefail
          release_dir="app/build/outputs/apk/release"
          mkdir -p dist

          universal="$(find "$release_dir" -type f \( -name '*universal*.apk' -o -name 'app-release.apk' \) -print -quit || true)"
          if [[ -z "$universal" ]]; then
            universal="$(find "$release_dir" -type f -name '*.apk' -print -quit || true)"
          fi
          [[ -n "$universal" ]] || { echo "::error::No release APK produced"; exit 1; }

          cp "$universal" "dist/MarbleMD-${MARBLEMD_VERSION_NAME}-universal.apk"

          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            src="$(find "$release_dir" -type f -name "*${abi}*.apk" -print -quit || true)"
            [[ -n "$src" ]] || src="$universal"
            cp "$src" "dist/MarbleMD-${MARBLEMD_VERSION_NAME}-${abi}.apk"
          done

          for apk in dist/*.apk; do
            "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk"
          done

          sha256sum dist/*.apk > dist/SHA256SUMS.txt

          asset_json() {
            local abi="$1"
            local file="$2"
            local hash
            hash="$(sha256sum "dist/$file" | awk '{print $1}')"
            printf '"%s":{"name":"%s","url":"https://github.com/%s/releases/download/%s/%s","sha256":"%s"}' \
              "$abi" "$file" "$GITHUB_REPOSITORY" "$MARBLEMD_RELEASE_TAG" "$file" "$hash"
          }

          {
            printf '{\n'
            printf '  "schema":1,\n'
            printf '  "versionCode":%s,\n' "$MARBLEMD_VERSION_CODE"
            printf '  "versionName":"%s",\n' "$MARBLEMD_VERSION_NAME"
            printf '  "tag":"%s",\n' "$MARBLEMD_RELEASE_TAG"
            printf '  "commit":"%s",\n' "$GITHUB_SHA"
            printf '  "assets":{\n'
            printf '    '; asset_json "arm64-v8a" "MarbleMD-${MARBLEMD_VERSION_NAME}-arm64-v8a.apk"; printf ',\n'
            printf '    '; asset_json "armeabi-v7a" "MarbleMD-${MARBLEMD_VERSION_NAME}-armeabi-v7a.apk"; printf ',\n'
            printf '    '; asset_json "x86_64" "MarbleMD-${MARBLEMD_VERSION_NAME}-x86_64.apk"; printf ',\n'
            printf '    '; asset_json "x86" "MarbleMD-${MARBLEMD_VERSION_NAME}-x86.apk"; printf ',\n'
            printf '    '; asset_json "universal" "MarbleMD-${MARBLEMD_VERSION_NAME}-universal.apk"; printf '\n'
            printf '  }\n'
            printf '}\n'
          } > dist/update.json

          echo "Standalone release assets:"
          ls -lah dist

      - name: Publish APKs directly to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$MARBLEMD_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$MARBLEMD_RELEASE_TAG" \
              dist/*.apk dist/SHA256SUMS.txt dist/update.json \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$MARBLEMD_RELEASE_TAG" \
              dist/*.apk dist/SHA256SUMS.txt dist/update.json \
              --target "$GITHUB_SHA" \
              --title "MarbleMD ${MARBLEMD_VERSION_NAME}" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
